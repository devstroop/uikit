<!--
  Progress — reference markup for server templates.
  Root: <div class="se-progress se-progress--<tone> [se-progress--indeterminate]"
        role="progressbar" aria-valuemin="0" aria-valuemax="<max>"
        [aria-valuenow="<value>"]>
  Modifiers:
    tone  --primary | --success | --warning | --danger   (default: --primary)
    state --indeterminate (omits aria-valuenow; bar is fixed at 40% and
           animated)
  Parts:
    bar  <div class="se-progress-bar">
  The server template sets the bar width inline — style="width: <percent>%"
  where percent = clamp(0, value / max * 100, 100) — and aria-valuenow to
  the rounded value clamped to [0, max]; both are omitted for indeterminate.
  No JS, no data-* hooks.
-->

<div class="se-progress se-progress--primary" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
  <div class="se-progress-bar" style="width: 40%"></div>
</div>

<div class="se-progress se-progress--primary" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
  <div class="se-progress-bar" style="width: 75%"></div>
</div>

<div class="se-progress se-progress--success" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
  <div class="se-progress-bar" style="width: 100%"></div>
</div>

<div class="se-progress se-progress--warning" role="progressbar" aria-valuenow="5" aria-valuemin="0" aria-valuemax="10">
  <div class="se-progress-bar" style="width: 50%"></div>
</div>

<div class="se-progress se-progress--danger" role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="10">
  <div class="se-progress-bar" style="width: 30%"></div>
</div>

<div class="se-progress se-progress--primary se-progress--indeterminate" role="progressbar" aria-valuemin="0" aria-valuemax="100">
  <div class="se-progress-bar"></div>
</div>

<div class="se-progress se-progress--primary" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
  <div class="se-progress-bar" style="width: 0%"></div>
</div>
