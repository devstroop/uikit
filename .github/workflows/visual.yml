name: Visual verification

on:
  pull_request:

jobs:
  visual:
    name: Visual verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - name: Preview theme vendor copies are in sync
        run: |
          for t in default fluent github material material-3 shadcn; do
            cp "themes/$t/tokens.css" "preview/htmx/vendor/tokens/$t.css"
          done
          git diff --exit-code -- preview/htmx/vendor/tokens/
      - run: npm run preview:build
      - run: node scripts/visual-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-screenshots
          path: visual/screenshots
