name: Visual verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: git submodule update --init frameworks/react frameworks/htmx
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm i -g npm@10.9.9
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - name: Preview theme vendor copies are in sync
        run: |
          for t in default fluent github material material-3 shadcn; do
            cp "themes/$t/tokens.css" "preview/htmx/vendor/tokens/$t.css"
          done
          git diff --exit-code -- preview/htmx/vendor/tokens/
      - run: npm run preview:build
      - run: node scripts/visual-verify.mjs
      - run: node scripts/generate-component-images.mjs --theme default --mode light
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: theme-screenshots
          path: visual/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: component-screenshots
          path: visual/components
