name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - fixes
      - features
      - chores
      - docs

jobs:
  tokens:
    name: Tokens & specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tokens:validate
      - name: Generated CSS is in sync
        run: |
          npm run tokens:generate
          git diff --exit-code
      - run: npm run specs:validate
      - run: npm run parity:validate

  htmx:
    name: htmx framework
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frameworks/htmx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frameworks/htmx/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Built bundle is in sync
        run: |
          node scripts/build.mjs
          git diff --exit-code
      - name: Demo vendor copies are in sync
        run: |
          cp dist/uikit.js dist/uikit.css ../../demo/htmx/vendor/
          git diff --exit-code -- ../../demo/htmx/vendor/

  demo:
    name: Demo (react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run demo:typecheck
      - run: npm run demo:build

  visual:
    name: Visual verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Demo theme vendor copies are in sync
        run: |
          for t in default fluent github material material-3 shadcn; do
            cp "themes/$t/tokens.css" "demo/htmx/vendor/tokens/$t.css"
          done
          git diff --exit-code -- demo/htmx/vendor/tokens/
      - run: npm run demo:build
      - run: node scripts/visual-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-screenshots
          path: visual/screenshots

  react:
    name: React framework
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frameworks/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frameworks/react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify built package exports
        run: node -e "import('./dist/main.es.js').then((m) => { const names = ['Button','Card','Badge','Icon','Stat','Table','EmptyState','Field','Label','Input','Select','Checkbox','Switch','Tooltip','Dialog','ToastProvider','useToast','Alert','Skeleton','Progress','Avatar','Tabs','Accordion','Textarea']; const missing = names.filter((n) => !(n in m)); if (missing.length) { console.error('missing exports:', missing); process.exit(1); } console.log('all', names.length, 'exports present'); })"