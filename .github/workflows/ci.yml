name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - fixes
      - features
      - chores
      - docs

jobs:
  tokens:
    name: Tokens & specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tokens:validate
      - name: Generated CSS is in sync
        run: |
          npm run tokens:generate
          git diff --exit-code
      - run: npm run specs:validate
      - run: npm run parity:validate

  htmx:
    name: htmx framework
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frameworks/htmx
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frameworks/htmx/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Built bundle is in sync
        run: |
          node scripts/build.mjs
          git diff --exit-code
      - name: Preview vendor copies are in sync
        run: |
          # preview/htmx/vendor/ is htmx-uikit's dist, not the frameworks/htmx
          # pin: the pin still builds the legacy --dt- bundle while themes/
          # and the preview markup are --dx-. Phase 5 repoints the submodule
          # and this goes back to a cp-from-pin comparison; until then the
          # in-repo invariant is that vendor and themes ship one generation.
          gen=$(grep -oE -- '--[a-z]+-' ../../themes/default/tokens.css | head -n1)
          gen=${gen#--}
          gen=${gen%-}
          for f in uikit.css uikit.js; do
            if ! grep -q -- "--$gen-" "../../preview/htmx/vendor/$f"; then
              echo "preview/htmx/vendor/$f does not use the '--$gen-' generation from themes/" >&2
              exit 1
            fi
          done

  preview:
    name: Preview (react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preview:typecheck
      - run: npm run preview:build

  react:
    name: React framework
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frameworks/react
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frameworks/react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify built package exports
        run: node -e "import('./dist/main.es.js').then((m) => { const names = ['Button','Card','Badge','Icon','Stat','Table','EmptyState','Field','Label','Input','Select','Checkbox','Switch','Tooltip','Dialog','ToastProvider','useToast','Alert','Skeleton','Progress','Avatar','Tabs','Accordion','Textarea']; const missing = names.filter((n) => !(n in m)); if (missing.length) { console.error('missing exports:', missing); process.exit(1); } console.log('all', names.length, 'exports present'); })"