      <section class="row">
        <h2>Button</h2>
        <div class="row-content">
          <button class="dx-button dx-button--primary" type="button">Primary</button>
          <button class="dx-button dx-button--secondary" type="button">Secondary</button>
          <button class="dx-button dx-button--ghost" type="button">Ghost</button>
          <button class="dx-button dx-button--danger" type="button">Danger</button>
          <button class="dx-button dx-button--success" type="button">Success</button>
          <button class="dx-button dx-button--info" type="button">Info</button>
          <button class="dx-button dx-button--primary" type="button" disabled>Disabled</button>
          <button class="dx-button dx-button--primary dx-button--sm" type="button">Small</button>
          <button class="dx-button dx-button--primary dx-button--lg" type="button">Large</button>
          <button class="dx-button dx-button--primary dx-button--xs" type="button">Extra small</button>
          <button class="dx-button dx-button--primary dx-button--icon-only" type="button" aria-label="Add item">+</button>
          <button class="dx-button dx-button--primary" type="button" hx-get="/partials/loaded.html" hx-target="#hx-target">
            htmx: load content
          </button>
          <div id="hx-target"></div>
        </div>
      </section>
      <section class="row">
        <h2>Tabs · Accordion</h2>
        <div class="row-content">
          <div class="dx-tabs" data-dx-tabs>
            <div class="dx-tabs-tablist dx-tabs-tablist--pills" role="tablist" data-dx-tablist>
              <button class="dx-tabs-tab dx-tabs-tab--active" type="button" role="tab" data-dx-tab data-dx-tab-key="one" id="preview-tab-one" aria-selected="true" aria-controls="preview-panel-one" tabindex="0">One</button>
              <button class="dx-tabs-tab" type="button" role="tab" data-dx-tab data-dx-tab-key="two" id="preview-tab-two" aria-selected="false" aria-controls="preview-panel-two" tabindex="-1">Two</button>
            </div>
            <div class="dx-tabs-panel" role="tabpanel" data-dx-tabpanel data-dx-tab-key="one" id="preview-panel-one" aria-labelledby="preview-tab-one"><p>Panel one.</p></div>
            <div class="dx-tabs-panel" role="tabpanel" data-dx-tabpanel data-dx-tab-key="two" id="preview-panel-two" aria-labelledby="preview-tab-two" hidden><p>Panel two.</p></div>
          </div>
          <div class="dx-tabs dx-tabs--left" data-dx-tabs>
            <div class="dx-tabs-tablist dx-tabs-tablist--underline dx-tabs-tablist--left" role="tablist" data-dx-tablist data-dx-tablist-orientation="vertical">
              <button class="dx-tabs-tab dx-tabs-tab--active" type="button" role="tab" data-dx-tab data-dx-tab-key="design" id="preview-tab-design" aria-selected="true" aria-controls="preview-panel-design" tabindex="0">Design</button>
              <button class="dx-tabs-tab" type="button" role="tab" data-dx-tab data-dx-tab-key="code" id="preview-tab-code" aria-selected="false" aria-controls="preview-panel-code" tabindex="-1">Code</button>
            </div>
            <div class="dx-tabs-panel" role="tabpanel" data-dx-tabpanel data-dx-tab-key="design" id="preview-panel-design" aria-labelledby="preview-tab-design"><p>Left-positioned tabs.</p></div>
            <div class="dx-tabs-panel" role="tabpanel" data-dx-tabpanel data-dx-tab-key="code" id="preview-panel-code" aria-labelledby="preview-tab-code" hidden><p>Arrow Up/Down navigates.</p></div>
          </div>
          <div class="dx-accordion" data-dx-accordion>
            <div class="dx-accordion-item" data-dx-accordion-item>
              <h3 class="dx-accordion-heading">
                <button class="dx-accordion-trigger" type="button" data-dx-accordion-trigger id="preview-acc-a" aria-expanded="false" aria-controls="preview-acc-panel-a">
                  <span class="dx-accordion-title">What is uikit?</span>
                  <span class="dx-accordion-chevron" aria-hidden="true">▾</span>
                </button>
              </h3>
              <div class="dx-accordion-panel" id="preview-acc-panel-a" role="region" aria-labelledby="preview-acc-a">
                <p>One contract — many deliveries.</p>
              </div>
            </div>
          </div>
        </div>
      </section>
