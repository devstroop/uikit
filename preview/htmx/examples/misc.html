      <section class="row">
        <h2>Button</h2>
        <div class="row-content">
          <button class="dt-button dt-button--primary" type="button">Primary</button>
          <button class="dt-button dt-button--secondary" type="button">Secondary</button>
          <button class="dt-button dt-button--ghost" type="button">Ghost</button>
          <button class="dt-button dt-button--danger" type="button">Danger</button>
          <button class="dt-button dt-button--success" type="button">Success</button>
          <button class="dt-button dt-button--info" type="button">Info</button>
          <button class="dt-button dt-button--primary" type="button" disabled>Disabled</button>
          <button class="dt-button dt-button--primary dt-button--sm" type="button">Small</button>
          <button class="dt-button dt-button--primary dt-button--lg" type="button">Large</button>

          </button>
          <div id="hx-target"></div>

      <section class="row">
        <h2>Tabs · Accordion</h2>
        <div class="row-content">
          <div class="dt-tabs" data-dt-tabs>
            <div class="dt-tabs-tablist dt-tabs-tablist--pills" role="tablist" data-dt-tablist>
              <button class="dt-tabs-tab dt-tabs-tab--active" type="button" role="tab" data-dt-tab data-dt-tab-key="one" id="preview-tab-one" aria-selected="true" aria-controls="preview-panel-one" tabindex="0">One</button>
              <button class="dt-tabs-tab" type="button" role="tab" data-dt-tab data-dt-tab-key="two" id="preview-tab-two" aria-selected="false" aria-controls="preview-panel-two" tabindex="-1">Two</button>
            </div>
            <div class="dt-tabs-panel" role="tabpanel" data-dt-tabpanel data-dt-tab-key="one" id="preview-panel-one" aria-labelledby="preview-tab-one"><p>Panel one.</p></div>
            <div class="dt-tabs-panel" role="tabpanel" data-dt-tabpanel data-dt-tab-key="two" id="preview-panel-two" aria-labelledby="preview-tab-two" hidden><p>Panel two.</p></div>
          </div>
          <div class="dt-tabs dt-tabs--left" data-dt-tabs>
            <div class="dt-tabs-tablist dt-tabs-tablist--underline dt-tabs-tablist--left" role="tablist" data-dt-tablist data-dt-tablist-orientation="vertical">
              <button class="dt-tabs-tab dt-tabs-tab--active" type="button" role="tab" data-dt-tab data-dt-tab-key="design" id="preview-tab-design" aria-selected="true" aria-controls="preview-panel-design" tabindex="0">Design</button>
              <button class="dt-tabs-tab" type="button" role="tab" data-dt-tab data-dt-tab-key="code" id="preview-tab-code" aria-selected="false" aria-controls="preview-panel-code" tabindex="-1">Code</button>
            </div>
            <div class="dt-tabs-panel" role="tabpanel" data-dt-tabpanel data-dt-tab-key="design" id="preview-panel-design" aria-labelledby="preview-tab-design"><p>Left-positioned tabs.</p></div>
            <div class="dt-tabs-panel" role="tabpanel" data-dt-tabpanel data-dt-tab-key="code" id="preview-panel-code" aria-labelledby="preview-tab-code" hidden><p>Arrow Up/Down navigates.</p></div>
          </div>
          <div class="dt-accordion" data-dt-accordion>
            <div class="dt-accordion-item" data-dt-accordion-item>
              <h3 class="dt-accordion-heading">
                <button class="dt-accordion-trigger" type="button" data-dt-accordion-trigger id="preview-acc-a" aria-expanded="false" aria-controls="preview-acc-panel-a">
                  <span class="dt-accordion-title">What is uikit?</span>
                  <span class="dt-accordion-chevron" aria-hidden="true">▾</span>
                </button>
              </h3>
              <div class="dt-accordion-panel" id="preview-acc-panel-a" role="region" aria-labelledby="preview-acc-a">
                <p>One contract — many deliveries.</p>
              </div>
            </div>
          </div>
        </div>
      </section>
